
{% extends "base.html" %}

{% block title %}
SNS - Add Notes
{% endblock %}

{% block navmenu %}

    <a href="/dashboard">Dashboard</a>
    <a href="/dashboard/notes" class="active">My Notes</a>
    <a href="/logout" class="logout-link">Logout</a>

{% endblock %}


{% block content %}

<div class="addnotes-page">

    <div class="addnotes-card">

        <div class="addnotes-heading">

            <span class="dashboard-label">
                NOTES MANAGEMENT
            </span>

            <h1>Create a New Note</h1>

            <p>
                Write down your ideas, lessons and
                important information.
            </p>

        </div>


        <form action="{{ url_for('addnotes') }}" method="POST">

            <div class="form-group">

                <label for="title">Note Title</label>

                <input type="text"
                       name="title"
                       id="title"
                       class="form-control"
                       placeholder="Example: Python Functions"
                       required>

            </div>


            <div class="form-group">

                <label for="content">Note Content</label>

                <textarea name="content"
                          id="content"
                          class="form-control notes-textarea"
                          rows="9"
                          placeholder="Start writing your notes here..."
                          required></textarea>

            </div>


            <div class="addnotes-actions">

                <a href="/dashboard/notes" class="btn-cancel">
                    Cancel
                </a>

                <button type="submit" class="btn-submit save-note-btn">
                    Save Note →
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
